name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The service directories are scaffolds until each stack lands (Activity 5).
  # This job reports which ones carry a dependency manifest; the build jobs below
  # skip themselves until theirs appears, and run in full from the commit that adds it.
  detect:
    name: Detect services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      ai-service: ${{ steps.check.outputs.ai-service }}
      web: ${{ steps.check.outputs.web }}
      mobile: ${{ steps.check.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          exists () {
            if [ -f "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: $2 found - job will run"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "$1: no $2 yet - job will be skipped"
            fi
          }
          exists backend    backend/requirements.txt
          exists ai-service ai-service/requirements.txt
          exists web        frontend/web/package.json
          exists mobile     frontend/mobile/pubspec.yaml

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required artefacts and relative links
        run: python .github/scripts/check-docs.py

  backend:
    name: Core API (FastAPI)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests (includes the authorisation suite required by ADR-004)
        working-directory: backend
        run: pytest -q

  ai-service:
    name: AI inference service
    needs: detect
    if: needs.detect.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint
        working-directory: ai-service
        run: ruff check .
      - name: Tests
        working-directory: ai-service
        run: pytest -q

  web:
    name: Web client (Next.js)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        working-directory: frontend/web
        run: npm run lint
      - name: Build
        working-directory: frontend/web
        run: npm run build

  mobile:
    name: Mobile client (Flutter)
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: frontend/mobile
        run: flutter pub get
      - name: Analyse
        working-directory: frontend/mobile
        run: flutter analyze
      - name: Tests
        working-directory: frontend/mobile
        run: flutter test

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
