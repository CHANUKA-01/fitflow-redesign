name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Core API (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests (includes the authorisation suite required by ADR-004)
        working-directory: backend
        run: pytest -q

  ai-service:
    name: AI inference service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: ai-service
        run: ruff check .
      - name: Tests
        working-directory: ai-service
        run: pytest -q

  web:
    name: Web client (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Lint
        working-directory: frontend/web
        run: npm run lint
      - name: Build
        working-directory: frontend/web
        run: npm run build

  mobile:
    name: Mobile client (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: frontend/mobile
        run: flutter pub get
      - name: Analyse
        working-directory: frontend/mobile
        run: flutter analyze
      - name: Tests
        working-directory: frontend/mobile
        run: flutter test

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
